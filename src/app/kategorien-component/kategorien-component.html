<main class="min-h-screen bg-gray-200 text-black px-8 py-10">

  <!--// Verbindet Filter und Filmübersicht-->
  <section class="max-w-7xl mx-auto">
    <div class="flex gap-8">
      <div class="w-72 sticky top-24 self-start">
        <h1 class="text-4xl font-bold mb-8">Kategorien</h1>

        <!--// Bindet Sortierung und Kategorienauswahl-->
        <app-kategorien-filter-component
          [(sortierung)]="sortierung"
          [(ausgewaehlteKategorien)]="ausgewaehlteKategorien"
        ></app-kategorien-filter-component>

      </div>

      <!--// Zeigt Filme passend zum Filter-->
      <app-kategorien-film-grid-component
        class="flex-1 min-w-0"
        [sortierung]="sortierung"
        [ausgewaehlteKategorien]="ausgewaehlteKategorien"
      ></app-kategorien-film-grid-component>

    </div>
  </section>
</main>
