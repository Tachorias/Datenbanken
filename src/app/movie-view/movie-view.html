<div>
  <style>
    .movie-container { width: 100%; max-width: 1280px; margin: 1% auto; }
    .movie-container video { width: 100%; height: auto; display: block; }
    .movie-title, .movie-description { text-align: left; }
  </style>

  <div class="movie-container">
    <video controls>
      <source src="assets/filme/{{ movie?.idFilme }}.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <h1 class="movie-title bold my-5 text-4xl">{{ movie?.Titel }}</h1>

    <p class="movie-description text-xl">{{ movie?.Beschreibung }}</p>
  </div>
</div>
