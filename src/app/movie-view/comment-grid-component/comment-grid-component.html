<div class="border-2 rounded-2xl bg-amber-100">
  <div class="p-2 font-bold border-b-2 text-center">Kommentare</div>
  <div >
    @if (authService.isLoggedIn()) {

      <div class="flex flex-col gap-4 w-full max-w-2xl">

    <textarea
      [(ngModel)]="inhalt"
      rows="5"
      placeholder="Schreibe einen Kommentar..."
      class="w-full rounded-lg border border-gray-300 p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y">
    </textarea>

        <button
          (click)="kommentarSchreiben()"
          [disabled]="!inhalt.trim()"
          class="self-start rounded-lg bg-blue-600 px-5 py-2 text-white font-medium transition hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed">
          Kommentar abschicken
        </button>

      </div>

    } @else {

      <p class="text-gray-500">
        Bitte melde dich an, um einen Kommentar zu schreiben.
      </p>

    }
  </div>
  <div class="m-2 max-h-80 overflow-y-auto">
    @if((kommentare$ | async); as kommentare) {
      @for (kommentar of kommentare; track kommentar) {
        <app-comment-card-component [comment]="kommentar"></app-comment-card-component>
      }
    }
  </div>
</div>
