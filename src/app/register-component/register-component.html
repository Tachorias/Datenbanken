<main class="bg-gray-200 min-h-screen flex items-center justify-center">

  <form
    class="flex flex-col gap-3"
    (ngSubmit)="registrieren()">

    <h1 class="text-3xl font-bold">
      Registrieren
    </h1>

    <input
      class="border rounded-xl p-2"
      type="text"
      placeholder="Benutzername"
      [(ngModel)]="benutzername"
      name="benutzername">

    <input
      class="border rounded-xl p-2"
      type="password"
      placeholder="Passwort"
      [(ngModel)]="passwort"
      name="passwort">

    <h2 class="font-bold mt-2">
      Ich registriere mich als
    </h2>

    <label class="flex items-center gap-2">
      <input
        type="radio"
        name="rolle"
        value="nutzer"
        [(ngModel)]="rolle">

      Nutzer
    </label>

    <label class="flex items-center gap-2">
      <input
        type="radio"
        name="rolle"
        value="produzent"
        [(ngModel)]="rolle">

      Produzent
    </label>

    @if (rolle === 'produzent') {

      <input
        class="border rounded-xl p-2"
        type="text"
        placeholder="Anzeigename"
        [(ngModel)]="anzeigename"
        name="anzeigename">

      <input
        class="border rounded-xl p-2"
        type="text"
        placeholder="Studiengang"
        [(ngModel)]="studiengang"
        name="studiengang">

      <input
        class="border rounded-xl p-2"
        type="email"
        placeholder="E-Mail"
        [(ngModel)]="email"
        name="email">

    }

    @if (fehlermeldung) {

      <p class="text-red-600 font-bold">
        {{ fehlermeldung }}
      </p>

    }

    <button
      class="bg-green-600 text-white rounded-xl py-2 hover:bg-green-700 transition"
      type="submit">

      Registrieren

    </button>

  </form>

</main>
